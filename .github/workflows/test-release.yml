name: Multi-platform Test Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Test release tag
        required: true
        default: v2.0.0

concurrency:
  group: test-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.3
  RELEASE_BASENAME: venera-netmatic-${{ inputs.tag }}

jobs:
  android:
    name: Android signed release APKs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Free Android runner disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h
          sudo rm -rf "$ANDROID_HOME/system-images" || true
          sudo rm -rf "$ANDROID_HOME/ndk"/* || true
          sudo rm -rf "$ANDROID_HOME/.temp" || true
          sudo apt-get clean
          echo "Disk usage after cleanup:"
          df -h
      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108"
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Sign release APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is required}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/venera-release.jks
          chmod 600 android/venera-release.jks
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner_path"
          for apk in build/app/outputs/flutter-apk/*.apk; do
            signed_apk="${apk%.apk}-signed.apk"
            "$apksigner_path" sign \
              --ks android/venera-release.jks \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$signed_apk" "$apk"
            mv "$signed_apk" "$apk"
            "$apksigner_path" verify --verbose "$apk"
          done
          rm -f android/venera-release.jks
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/*.apk dist/
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS unsigned IPA
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          ditto -c -k --sequesterRsrc --keepParent dist/Payload "dist/${RELEASE_BASENAME}-ios-unsigned.ipa"
          rm -rf dist/Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS unsigned app
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package macOS app
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/Venera Netmatic.app" "dist/${RELEASE_BASENAME}-macos-arm64-unsigned.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64 portable
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/${env:RELEASE_BASENAME}-windows-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux x64 portable
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package Linux app
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release -czf "dist/${RELEASE_BASENAME}-linux-x64.tar.gz" bundle
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish test pre-release
    needs: [android, ios, macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          title="Venera Netmatic multi-platform test ${TAG}"
          notes="Signed Android APKs, an unsigned iOS IPA for local Xcode signing, an unsigned macOS ZIP (Gatekeeper may require Open Anyway), and portable Windows/Linux builds. These artifacts are for sideload and build verification; they are not store submissions."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "$title" --notes "$notes"
          else
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "$title" \
              --notes "$notes"
          fi
